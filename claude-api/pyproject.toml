[project]
name = "claude-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.4.0",
    "python-dotenv>=1.2.4",
]

[tool.uv.workspace]
members = []

[dependency-groups]
voyage = [
    "voyageai>=0.3.2",
]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
