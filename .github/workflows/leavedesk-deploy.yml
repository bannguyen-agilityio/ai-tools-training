name: leavedesk-deploy

# The target environment is inferred from the branch:
#   push to `staging` -> staging (automatic)
#   push to `main`    -> production (waits for required reviewers on the "production" environment)
# Manual runs infer it from the branch they run on; on a tag (rollback) pass `environment`.
# Per-environment config (Settings > Environments > staging | production):
#   secrets: FASTAPI_CLOUD_TOKEN, DATABASE_URL (pooled, app role), MIGRATION_DATABASE_URL (owner), SENDGRID_API_KEY
#   vars:    FASTAPI_CLOUD_APP_ID, APP_URL, APP_DB_ROLE, COMPANY_TZ, EMAIL_FROM
# APP_BASE_URL is set from the APP_URL var. Runtime settings and secrets (SENDGRID_API_KEY, EMAIL_FROM, ...) live in the FastAPI Cloud app environment.
# See leavedesk/docs/runbooks/secrets.md for the full inventory (names only).

on:
  push:
    branches: [main, staging]
    paths: ["leavedesk/**", ".github/workflows/leavedesk-deploy*.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Override the environment (required when running on a tag, e.g. a rollback)."
        type: choice
        options: ["", staging, production]
        default: ""
      ref:
        description: "Ref to deploy (branch, tag or SHA). Defaults to the ref this run was started on."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        env:
          OVERRIDE: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
        run: |
          if [ -n "$OVERRIDE" ]; then env_name="$OVERRIDE"
          else
            case "$BRANCH" in
              main) env_name=production ;;
              staging) env_name=staging ;;
              *) echo "::error::cannot infer an environment from '${BRANCH:-a tag}'; run on main/staging or set the environment input"; exit 1 ;;
            esac
          fi
          echo "environment=$env_name" >> "$GITHUB_OUTPUT"
          echo "Deploying to $env_name"

  checks:
    needs: target
    uses: ./.github/workflows/leavedesk-ci.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: [target, checks]
    uses: ./.github/workflows/leavedesk-deploy-env.yml
    with:
      environment: ${{ needs.target.outputs.environment }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  # Tag what reached production so rolling back is "redeploy the previous prod-* tag".
  tag-production:
    needs: [target, deploy]
    if: needs.target.outputs.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: |
          tag="prod-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          git tag "$tag"
          git push origin "$tag"
          echo "tagged $tag"
