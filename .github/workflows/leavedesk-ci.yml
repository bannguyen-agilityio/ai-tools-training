name: leavedesk-ci

on:
  push:
    paths: ["leavedesk/**", ".github/workflows/leavedesk-ci.yml"]
  pull_request:
    paths: ["leavedesk/**", ".github/workflows/leavedesk-ci.yml"]

defaults:
  run:
    working-directory: leavedesk

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leavedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Owner/superuser URL; tests SET ROLE leavedesk_app to exercise the real grants.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leavedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q
      - name: Migration applies and rolls back
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leavedesk_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
