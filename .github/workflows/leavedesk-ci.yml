name: leavedesk-ci

on:
  push:
    paths: ["leavedesk/**", ".github/workflows/leavedesk-ci.yml"]
  pull_request:
    paths: ["leavedesk/**", ".github/workflows/leavedesk-ci.yml"]
  workflow_call:

defaults:
  run:
    working-directory: leavedesk

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leavedesk/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: leavedesk/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: leavedesk/frontend/dist

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leavedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Owner/superuser URL; tests connect as APP_DB_ROLE (tests/test.env) to exercise the real grants.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/leavedesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: leavedesk/frontend/dist
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run python scripts/check_single_head.py
      - run: uv run pytest -q
      - name: Migration applies and rolls back
        env:
          # Same env file the tests use; DATABASE_URL points at the CI service.
          ENV_FILE: tests/test.env
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
