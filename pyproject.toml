[project]
name = "ai-tools-training"
version = "0.1.0"
description = "Workspace-level environment so root-level checks (pytest, ruff, pyright) can run."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
testpaths = ["memory-context-sessions/app/tests"]
pythonpath = ["memory-context-sessions"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
include = ["memory-context-sessions/app"]
extraPaths = ["memory-context-sessions"]
venvPath = "."
venv = ".venv"
